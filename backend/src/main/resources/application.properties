spring.application.name=boardgame-backend
server.port=${PORT:8080}

# --- Database Configuration ---
# Fallback to H2 for local development, otherwise use environment variables for Postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:boardgamedb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# --- JWT ---
jwt.secret=${JWT_SECRET:boardgame-super-secret-key-for-jwt-do-not-expose-in-production-2024}
jwt.expiration=86400000

# --- CORS ---
# In production, this should be the URL of your frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://frontend.coup-boardgame.orb.local}
