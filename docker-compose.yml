services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: boardgamedb
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: boardgame123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/boardgamedb
      SPRING_DATASOURCE_USERNAME: boardgame
      SPRING_DATASOURCE_PASSWORD: boardgame123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: boardgame-super-secret-key-for-jwt-do-not-expose-in-production-2024
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
