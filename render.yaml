services:
  # --- Backend Web Service (Spring Boot) ---
  - type: web
    name: boardgame-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: boardgame-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://boardgame-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true

  - type: static
    name: boardgame-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://boardgame-backend.onrender.com/api
      - key: VITE_WS_URL
        value: https://boardgame-backend.onrender.com/ws
        
databases:
  - name: boardgame-db
    plan: free
    region: singapore
