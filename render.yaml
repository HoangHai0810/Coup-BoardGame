services:
  - type: web
    name: boardgame-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: ""
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: boardgame-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: boardgame-db
          property: port
      - key: SPRING_DATASOURCE_DATABASE
        fromDatabase:
          name: boardgame-db
          property: database
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: boardgame-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: boardgame-db
          property: password
      - key: SPRING_JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://boardgame-frontend-k2so.onrender.com,https://boardgame-frontend.onrender.com,http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET
        value: boardgame-prod-secret-key-2024-replace-this-in-dashboard

  - type: web
    name: boardgame-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://boardgame-backend-tcuh.onrender.com/api
      - key: VITE_WS_URL
        value: https://boardgame-backend-tcuh.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: boardgame-db
    plan: free
    region: singapore
