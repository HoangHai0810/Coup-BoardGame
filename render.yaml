services:
  - type: web
    name: boardgame-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: boardgame-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://boardgame-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: boardgame-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://boardgame-backend.onrender.com/api
      - key: VITE_WS_URL
        value: https://boardgame-backend.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: boardgame-db
    plan: free
    region: singapore
